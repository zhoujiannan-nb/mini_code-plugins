<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini_code 开机动画 · 极简终端</title>
<!--
  第二个示例主题:证明主题可以很短、风格可以完全自由(这个只有 2.6 秒,纯终端味)。
  宿主用 sandbox iframe 加载,所以这里读不到宿主的任何数据。
-->
<style>
  :root {
    --k: 1;
    --fg: #7ee2a8;
    --bg: #06080a;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); }
  .wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 15px/1.9 var(--mono); color: var(--fg); text-shadow: 0 0 8px rgba(126, 226, 168, .45); }
  .box { width: min(560px, 86vw); }
  .ln { opacity: 0; white-space: pre; }
  .ln.on { opacity: 1; }
  .ln.dim { color: rgba(126, 226, 168, .55); text-shadow: none; }
  .ok { color: #d7ffe9; }
  .cur::after { content: "\258D"; animation: bl calc(.9s * var(--k)) step-end infinite; }
  @keyframes bl { 50% { opacity: 0; } }
  .glow { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px); }
  .skip { position: absolute; right: 24px; bottom: 24px; background: none; border: 0;
    color: rgba(126, 226, 168, .5); font: 11px/1 var(--mono); cursor: pointer; }
  .skip:hover { color: var(--fg); }
  .gone { opacity: 0; transition: opacity calc(420ms * var(--k)) ease-out; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="box" id="box"></div>
  <div class="glow"></div>
  <button class="skip" id="skip">esc</button>
</div>
<script>
(function () {
  "use strict";
  var ID = "mc-minimal", q = new URLSearchParams(location.search);
  var speed = Math.min(3, Math.max(0.35, parseFloat(q.get("speed")) || 1));
  var name = (q.get("name") || "").slice(0, 24);
  document.documentElement.style.setProperty("--k", String(1 / speed));
  if (q.get("accent")) document.documentElement.style.setProperty("--fg", q.get("accent"));

  function send(t, e) {
    try { var m = { mc: "boot-anim", type: t, id: ID }; for (var k in e) m[k] = e[k]; parent.postMessage(m, "*"); } catch (x) {}
  }
  var box = document.getElementById("box"), wrap = document.getElementById("wrap"), done = false;
  var L = [
    ["$ mini_code boot --local", ""],
    ["  sessions  ", "ok"],
    ["  models    ", "ok"],
    [name ? "  hello, " + name : "  hello, dev", "dim"]
  ];
  send("ready", { durationMs: 2600, maxMs: 9000, steps: L.length });

  var i = 0;
  (function step() {
    if (i >= L.length) {
      var last = document.createElement("div");
      last.className = "ln on cur";
      last.textContent = "\nready.";
      box.appendChild(last);
      setTimeout(function () {
        wrap.classList.add("gone");
        send("handoff");                              // 淡出开始 = 宿主可以接住了
        setTimeout(function () { if (!done) { done = true; send("done", { by: "auto" }); wrap.style.display = "none"; } },
          440 / speed);
      }, 700 / speed);
      return;
    }
    var d = document.createElement("div");
    d.className = "ln on" + (L[i][1] ? " " + L[i][1] : "");
    d.textContent = L[i][0] + (i ? "" : "");
    if (i) d.innerHTML = d.textContent + '<span class="ok">[ok]</span>';
    box.appendChild(d);
    i++;
    setTimeout(step, 420 / speed);
  })();

  function finish(by) {
    if (done) return; done = true;
    send("done", { by: by }); wrap.style.display = "none";
  }
  document.getElementById("skip").addEventListener("click", function () { finish("skip"); });
  addEventListener("keydown", function (e) { if (e.key === "Escape") finish("skip"); });
  setTimeout(function () { finish("timeout"); }, 9000);
})();
</script>
</body>
</html>
