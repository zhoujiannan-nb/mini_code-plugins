<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini_code 开机动画 · 技术档案</title>
<!--
  mini_code 开机动画主题:mc-tech-archive
  结构借鉴 dsh-startup-screen / dsh-chat-wallpaper(MIT, (c) LeeRolling)的几处手法:
    · 标识开场(眼睑睁开 + 字距展开 + 扫光)→ 黑幕 → 过曝洗白 → 档案底板 → 分步文字 → 色散故障揭幕
    · 中文主字 + 英文等宽副标题逐字打出(像终端在接收数据)
    · "handoff" 信号:在【开始淡出】那一瞬间就通知宿主可以叠化,而不是等淡完
    · 语音/音效:voice-hello.wav(睁眼+字标)、voice-welcome.wav(小标题)、
      sfx-flash.wav(洗白那一下)。素材由 tools/gen_audio.py 离线合成(Windows TTS),
      换台词改那个脚本重跑即可。宿主 iframe 带 allow="autoplay",但播放仍可能被打断,
      所以每个 play() 都 catch 掉 —— 没声音也必须能演完。mute=1 直接不出声。
  两条约束(别踩):
    · 跳过 affordance 归宿主(右下角那颗 + Esc)。主题里【不要】再画一颗"跳过 Esc",
      否则画面右下角会出现两层跳过按钮;这里的按钮只在 interactive 模式下当"继续 ▸"用。
    · 自包含:无外部依赖、不联网、不读宿主任何东西(宿主以 sandbox iframe 加载)。
  可调参数(query):speed / name / interactive / accent / brand / sub / mute / ver
  配色跟 mini_code 本体一致(深色 #111214 / 主色 #5b8cff)。
-->
<style>
  :root {
    --k: 1;                       /* 时间缩放:速度 = 1/--k,所有时长都乘它 */
    --accent: #5b8cff;
    --bg: #0b0d11;
    --text: #e9edf3;
    --text3: #9fb0c4;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    --ui: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); font-family: var(--ui); -webkit-font-smoothing: antialiased; }

  .seq { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
  .seq.gone { opacity: 0; transform: scale(1.035); filter: blur(5px);
    transition: opacity calc(700ms * var(--k)) cubic-bezier(.4, 0, .2, 1),
                transform calc(700ms * var(--k)) cubic-bezier(.4, 0, .2, 1),
                filter calc(700ms * var(--k)) ease-out; }

  /* ---------- 底板:网格 + 扫描线 + 四角括号 + HUD ---------- */
  .grid, .scan { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .on .grid { opacity: 1; transition: opacity calc(700ms * var(--k)) ease-out; }
  .grid {
    background-image:
      linear-gradient(rgba(148, 163, 184, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, .055) 1px, transparent 1px);
    background-size: 44px 44px, 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, #000 35%, transparent 100%);
            mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, #000 35%, transparent 100%);
  }
  .scan {
    background: linear-gradient(180deg, transparent 0%, rgba(91, 140, 255, .16) 48%, transparent 60%);
    height: 42%; animation: sweep calc(3.2s * var(--k)) linear infinite;
  }
  @keyframes sweep { from { transform: translateY(-100%); } to { transform: translateY(260%); } }

  .hud {
    position: absolute; left: 26px; right: 26px; display: flex; justify-content: space-between;
    font: 11px/1 var(--mono); letter-spacing: .12em; color: var(--text3);
    opacity: 0; text-transform: uppercase;
  }
  .hud-t { top: 22px; } .hud-b { bottom: 22px; }
  .on .hud { opacity: .85; transition: opacity calc(600ms * var(--k)) ease-out calc(160ms * var(--k)); }
  .brk { position: absolute; width: 18px; height: 18px; border: 1px solid rgba(91, 140, 255, .5); opacity: 0; }
  .on .brk { opacity: 1; transition: opacity calc(500ms * var(--k)) ease-out calc(220ms * var(--k)); }
  .brk.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; }
  .brk.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; }
  .brk.bl { bottom: 16px; left: 16px; border-right: 0; border-top: 0; }
  .brk.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; }

  /* ---------- 中央舞台 ---------- */
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; }

  /* ---------- 开场:标识(第一帧就在画上,不是从纯黑里浮出来)---------- */
  .brand {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 30px;
  }
  .brand.out { opacity: 0; transform: scale(.84); filter: blur(7px);
    transition: opacity calc(520ms * var(--k)) ease-in, transform calc(520ms * var(--k)) ease-in,
                filter calc(520ms * var(--k)) ease-in; }
  .eye { position: relative; width: 168px; height: 96px; opacity: .34;
    transition: opacity calc(500ms * var(--k)) ease-out; }
  .eye.open { opacity: 1; }
  /* 眼球:竖向压扁 = 闭眼,展开 = 睁眼(靠 clip 保证不越出眼形) */
  .iris { transform-box: fill-box; transform-origin: 50% 50%;
    transform: scaleY(.05); opacity: .5; }
  .eye.open .iris { transform: scaleY(1); opacity: 1;
    transition: transform calc(900ms * var(--k)) cubic-bezier(.16, 1, .3, 1),
                opacity calc(300ms * var(--k)) ease-out; }
  /* 上下眼睑:从中间合拢到各自退回原位 */
  .lid { transition: transform calc(900ms * var(--k)) cubic-bezier(.16, 1, .3, 1); }
  .lid.t { transform: translateY(23px); }
  .lid.b { transform: translateY(-23px); }
  .eye.open .lid.t { transform: translateY(0); }
  .eye.open .lid.b { transform: translateY(0); }
  .closed-line { opacity: 1; transition: opacity calc(260ms * var(--k)) ease-in; }
  .eye.open .closed-line { opacity: 0; }
  /* 睁开后掠过的一道高光 */
  .glint { opacity: 0; }
  .eye.open .glint { animation: glint calc(760ms * var(--k)) ease-out calc(560ms * var(--k)) 1; }
  @keyframes glint {
    0% { opacity: 0; transform: translateX(-46px); }
    25% { opacity: .95; }
    100% { opacity: 0; transform: translateX(46px); }
  }
  .brandtext { text-align: center; }
  .word {
    font-size: 34px; font-weight: 700; line-height: 1.1; color: var(--text);
    letter-spacing: -.02em; opacity: .16; filter: blur(7px);
  }
  .word.in { letter-spacing: .3em; opacity: 1; filter: blur(0);
    transition: letter-spacing calc(920ms * var(--k)) cubic-bezier(.16, 1, .3, 1),
                opacity calc(560ms * var(--k)) ease-out, filter calc(560ms * var(--k)) ease-out; }
  .word::after { content: ""; display: block; width: 0; height: 2px; margin: 16px auto 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0; }
  .word.in::after { width: 214px; opacity: .85;
    transition: width calc(820ms * var(--k)) cubic-bezier(.4, 0, .2, 1) calc(180ms * var(--k)),
                opacity calc(300ms * var(--k)) ease-out; }
  .sub { margin-top: 18px; font-size: 15px; letter-spacing: .42em; color: var(--text3);
    opacity: 0; transform: translateY(8px); text-indent: .42em; }
  .sub.in { opacity: 1; transform: translateY(0);
    transition: opacity calc(600ms * var(--k)) ease-out, transform calc(600ms * var(--k)) ease-out; }
  .sub-en { margin-top: 12px; font: 10px/1 var(--mono); letter-spacing: .3em;
    color: rgba(91, 140, 255, .75); opacity: 0; text-indent: .3em; }
  .sub-en.in { opacity: 1; transition: opacity calc(600ms * var(--k)) ease-out calc(200ms * var(--k)); }

  .mark { position: relative; width: 132px; height: 132px;
    opacity: 0; transform: scale(1.06); filter: blur(6px); }
  .mark.in { opacity: 1; transform: scale(1); filter: blur(0);
    transition: opacity calc(820ms * var(--k)) ease-out,
                transform calc(900ms * var(--k)) cubic-bezier(.16, 1, .3, 1),
                filter calc(820ms * var(--k)) ease-out; }
  .mark.burst { filter: brightness(3.4) blur(1px);
    transition: filter calc(260ms * var(--k)) ease-in; }
  .mark.hidden { opacity: 0; transform: scale(.94);
    transition: opacity calc(420ms * var(--k)) ease-in, transform calc(420ms * var(--k)) ease-in; }
  .ring { transform-origin: 50% 50%; animation: spin calc(38s * var(--k)) linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .arc { stroke-dasharray: 226; stroke-dashoffset: 226; }
  .mark.in .arc { stroke-dashoffset: 40;
    transition: stroke-dashoffset calc(1500ms * var(--k)) cubic-bezier(.4, 0, .2, 1) calc(300ms * var(--k)); }

  .cap { text-align: center; min-height: 108px; }
  .cn { font-size: 38px; font-weight: 700; letter-spacing: .06em; color: var(--text);
    opacity: 0; transform: translateY(12px); }
  .cn.show { opacity: 1; transform: translateY(0);
    transition: opacity calc(380ms * var(--k)) ease-out, transform calc(420ms * var(--k)) cubic-bezier(.16, 1, .3, 1); }
  .cn.out { opacity: 0; transform: translateY(-10px); filter: blur(3px);
    transition: opacity calc(260ms * var(--k)) ease-in, transform calc(260ms * var(--k)) ease-in,
                filter calc(260ms * var(--k)) ease-in; }
  .en { margin-top: 12px; height: 18px; font: 15px/18px var(--mono); letter-spacing: .16em;
    color: var(--accent); white-space: pre; }
  /* 光标只在"终端出现"之后才闪:开场那一幕不该有根孤零零的光标 */
  .on .en::after { content: "\258D"; margin-left: 2px; animation: blink calc(1s * var(--k)) step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 色散故障:三层文字错位的 RGB 分离 */
  .glitch .cn { color: var(--text);
    text-shadow: 2px 0 rgba(255, 60, 90, .85), -2px 0 rgba(60, 200, 255, .85);
    animation: shake calc(120ms * var(--k)) steps(2) 3; }
  @keyframes shake { 33% { transform: translate(-3px, 1px); } 66% { transform: translate(3px, -1px); } }

  /* 过曝洗白 */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: pop calc(420ms * var(--k)) ease-out; }
  @keyframes pop { 0% { opacity: 0; } 22% { opacity: .96; } 100% { opacity: 0; } }

  /* 步骤指示 */
  .steps { position: absolute; bottom: 52px; left: 0; right: 0; display: flex;
    justify-content: center; gap: 10px; opacity: 0; }
  .steps.on { opacity: 1; transition: opacity calc(400ms * var(--k)) ease-out; }
  .steps i { width: 26px; height: 2px; background: rgba(148, 163, 184, .25); border-radius: 2px; }
  .steps i.hit { background: var(--accent); box-shadow: 0 0 10px rgba(91, 140, 255, .7);
    transition: background calc(200ms * var(--k)) ease-out; }

  /* interactive 模式的「继续 ▸」。注意:不是"跳过" —— 跳过归宿主,主题再画一个就是两层按钮 */
  .next { position: absolute; right: 26px; bottom: 46px; border: 1px solid rgba(91, 140, 255, .45);
    background: rgba(91, 140, 255, .08); color: var(--text); font: 12px/1 var(--mono); letter-spacing: .08em;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; opacity: 0; pointer-events: none; }
  .next.on { opacity: 1; pointer-events: auto; transition: opacity calc(400ms * var(--k)) ease-out; }
  .next:hover { border-color: var(--accent); background: rgba(91, 140, 255, .16); }
</style>
</head>
<body>
<div class="seq" id="seq">
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="brk tl"></div><div class="brk tr"></div><div class="brk bl"></div><div class="brk br"></div>
  <div class="hud hud-t"><span>MINICODE // BOOT SEQ</span><span id="hud-r">ARCHIVE · LOCAL</span></div>
  <div class="hud hud-b"><span id="hud-sess">SESSION ----</span><span id="hud-time">--:--:--</span></div>

  <div class="stage">
    <!-- 开场:眼睛睁开 → 品牌字距展开 → 小标题 -->
    <div class="brand" id="brand">
      <div class="eye" id="eye">
        <svg viewBox="0 0 168 96" width="168" height="96" aria-hidden="true">
          <defs>
            <clipPath id="lens"><path d="M14 48Q84 2 154 48Q84 94 14 48Z"/></clipPath>
            <radialGradient id="irisg" cx="50%" cy="42%" r="62%">
              <stop offset="0%" stop-color="#9dbcff"/><stop offset="62%" stop-color="#5b8cff"/>
              <stop offset="100%" stop-color="#1d3766"/>
            </radialGradient>
            <linearGradient id="glintg" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
              <stop offset="50%" stop-color="#fff" stop-opacity=".9"/>
              <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <!-- 眼形外框:第一帧就看得见,画面不是纯黑 -->
          <path d="M14 48Q84 2 154 48Q84 94 14 48Z" fill="rgba(91,140,255,.05)"
                stroke="rgba(91,140,255,.38)" stroke-width="1.5"/>
          <g clip-path="url(#lens)">
            <g class="iris" id="iris">
              <circle cx="84" cy="48" r="24" fill="url(#irisg)"/>
              <circle cx="84" cy="48" r="10.5" fill="#0b0d11"/>
              <!-- 瞳孔就是终端提示符:mini_code 的"眼"其实是光标 -->
              <path d="M79 42.5l6 5.5-6 5.5" fill="none" stroke="#e9edf3" stroke-width="2.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="75" cy="39" r="3.4" fill="rgba(255,255,255,.85)"/>
            </g>
            <rect class="glint" x="60" y="18" width="26" height="60" fill="url(#glintg)"/>
          </g>
          <!-- 眼睑:底色块 + 一条睫毛线,从合拢处退回原位 -->
          <g class="lid t" id="lidt">
            <path d="M8 48Q84 4 160 48L160 -20L8 -20Z" fill="var(--bg)"/>
            <path d="M14 48Q84 6 154 48" fill="none" stroke="rgba(159,176,196,.55)" stroke-width="2"/>
          </g>
          <g class="lid b" id="lidb">
            <path d="M8 48Q84 92 160 48L160 116L8 116Z" fill="var(--bg)"/>
            <path d="M14 48Q84 90 154 48" fill="none" stroke="rgba(159,176,196,.55)" stroke-width="2"/>
          </g>
          <path class="closed-line" d="M40 48H128" stroke="rgba(91,140,255,.8)" stroke-width="2.5"
                stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brandtext">
        <div class="word" id="word"></div>
        <div class="sub" id="sub"></div>
        <div class="sub-en" id="sub-en"></div>
      </div>
    </div>

    <div class="mark" id="mark">
      <svg viewBox="0 0 132 132" width="132" height="132" aria-hidden="true">
        <g class="ring" fill="none" stroke-linecap="round">
          <!-- 环形准星:缺口留在正下方,不挡住底部文字 -->
          <circle cx="66" cy="66" r="58" stroke="rgba(91,140,255,.22)" stroke-width="1"/>
          <circle class="arc" cx="66" cy="66" r="58" stroke="#5b8cff" stroke-width="2"
                  stroke-dasharray="226" transform="rotate(104 66 66)"/>
          <g stroke="rgba(91,140,255,.55)" stroke-width="1.5">
            <path d="M66 4v9M66 119v9M4 66h9M119 66h9"/>
          </g>
        </g>
        <g fill="none" stroke="#e9edf3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M47 55l11 11-11 11"/><path d="M66 79h21"/>
        </g>
      </svg>
    </div>
    <div class="cap">
      <div class="cn" id="cn"></div>
      <div class="en" id="en"></div>
    </div>
  </div>

  <div class="steps" id="steps"><i></i><i></i><i></i></div>
  <div class="flash" id="flash"></div>
  <button class="next" id="next">继续 ▸</button>
</div>

<script>
(function () {
  "use strict";
  var ID = "mc-tech-archive";
  var q = new URLSearchParams(location.search);
  var speed = Math.min(3, Math.max(0.35, parseFloat(q.get("speed")) || 1));
  var name = (q.get("name") || "").slice(0, 24);
  var interactive = q.get("interactive") === "1";
  var brand = (q.get("brand") || "Mini Code").slice(0, 24);
  var sub = (q.get("sub") || "欢迎来到人类联盟").slice(0, 28);
  var mute = q.get("mute") === "1" || q.get("sound") === "0";   // 宿主「静默」勾选
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) speed = Math.min(3, speed * 3);          // 系统要求减少动效 → 快进,但仍然走完
  if (q.get("accent")) document.documentElement.style.setProperty("--accent", q.get("accent"));
  document.documentElement.style.setProperty("--k", String(1 / speed));

  function send(type, extra) {                          // 与宿主的唯一通道(跨 iframe)
    try {
      var m = { mc: "boot-anim", type: type, id: ID };
      for (var k in extra) m[k] = extra[k];
      parent.postMessage(m, "*");
    } catch (e) {}
  }

  // ---- 语音/音效 ----
  // 宿主给 iframe 加了 allow="autoplay",但自动播放还是可能被打断(策略、设备、
  // 用户静音),所以一律 catch:没声音也必须能把动画演完。mute=1 时干脆不加载。
  var CLIPS = {
    hello: ["voice-hello.wav", 0.85],
    welcome: ["voice-welcome.wav", 0.85],
    flash: ["sfx-flash.wav", 0.5]
  };
  var sounds = {};
  if (!mute) {
    Object.keys(CLIPS).forEach(function (k) {
      try {
        var a = new Audio(CLIPS[k][0]);
        a.preload = "auto";
        a.volume = CLIPS[k][1];
        a.addEventListener("error", function () {});      // 素材缺失也别炸
        sounds[k] = a;
      } catch (e) {}
    });
  }
  function cue(k) {
    var a = sounds[k];
    if (!a) return;
    try {
      a.currentTime = 0;
      var p = a.play();
      if (p && p.catch) p.catch(function () {});          // 被策略拦掉就当没声音
    } catch (e) {}
  }

  var seq = document.getElementById("seq"), mark = document.getElementById("mark");
  var cn = document.getElementById("cn"), en = document.getElementById("en");
  var steps = document.getElementById("steps"), nextBtn = document.getElementById("next");
  var flash = document.getElementById("flash");
  var brandEl = document.getElementById("brand"), eye = document.getElementById("eye");
  var word = document.getElementById("word"), subEl = document.getElementById("sub");
  var subEn = document.getElementById("sub-en");
  var finished = false, timers = [], typer = null;

  word.textContent = brand;
  subEl.textContent = sub;
  subEn.textContent = "WELCOME TO THE HUMAN ALLIANCE";

  // HUD:会话号 + 实时时钟(真数据,不是贴图)
  var sess = "SESSION " + Math.random().toString(16).slice(2, 6).toUpperCase();
  document.getElementById("hud-sess").textContent = sess;
  var clock = document.getElementById("hud-time");
  function tick() { clock.textContent = new Date().toTimeString().slice(0, 8); }
  tick(); var clockT = setInterval(tick, 500);
  document.getElementById("hud-r").textContent = "ARCHIVE · v" + (q.get("ver") || "1.2");

  var STEPS = [
    ["装载本地会话", "LOADING LOCAL SESSIONS"],
    ["接通模型通道", "OPENING MODEL CHANNEL"],
    [name ? "欢迎 " + name + " 接入" : "权限校验通过", name ? "WELCOME, " + name.toUpperCase() : "PERMISSION VERIFIED"]
  ];

  function at(ms, fn) { timers.push(setTimeout(fn, Math.round(ms / speed))); }
  function type(text, done) {                          // 英文等宽副标题逐字打出
    if (typer) clearInterval(typer);
    en.textContent = ""; var i = 0;
    typer = setInterval(function () {
      en.textContent = text.slice(0, ++i);
      if (i >= text.length) { clearInterval(typer); typer = null; if (done) done(); }
    }, Math.max(6, 22 / speed));
  }
  function showStep(n, then) {
    cn.className = "cn";
    void cn.offsetWidth;                               // 强制重排,让 out→show 的过渡重新生效
    cn.textContent = STEPS[n][0];
    cn.classList.add("show");
    if (steps.children[n]) steps.children[n].classList.add("hit");
    send("step", { step: n });
    type(STEPS[n][1], then);
  }
  function next(n) {
    if (n >= STEPS.length) { finale(); return; }
    if (n > 0) {
      cn.classList.remove("show"); cn.classList.add("out");
      at(240, function () { showStep(n, function () { after(n); }); });
    } else {
      showStep(n, function () { after(n); });
    }
  }
  function after(n) { if (interactive && n < STEPS.length - 1) waitForClick(n + 1); else at(900, function () { next(n + 1); }); }
  var pending = null;
  function waitForClick(n) { pending = n; nextBtn.classList.add("on"); }
  function finale() {
    seq.classList.add("glitch");
    at(360, function () {
      // handoff:淡出【开始】的瞬间就告诉宿主可以叠化了(等淡完再通知会闪一下)
      seq.classList.add("gone");
      send("handoff");
      at(700, function () { finish("auto"); });
    });
  }
  function finish(by) {
    if (finished) return;
    finished = true;
    timers.forEach(clearTimeout); if (typer) clearInterval(typer); clearInterval(clockT);
    send("done", { by: by });
    seq.style.display = "none";                        // 交还画面,别挡住下面的 UI
  }
  // 推进按钮(interactive 专用)。跳过不在这里 —— 宿主右下角那颗才是跳过。
  nextBtn.addEventListener("click", function () {
    if (pending == null) return;
    var n = pending; pending = null; nextBtn.classList.remove("on"); next(n);
  });
  addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); finish("skip"); }
    else if ((e.key === "Enter" || e.key === " ") && pending != null) {
      e.preventDefault(); nextBtn.click();
    }
  });

  // ---- 时间线(毫秒 @1x)----
  // 0     第一帧:眼形外框 + 糊着的品牌字已经在画上
  // 60    眼睑睁开(900ms)→ 瞳孔里是终端光标 → 560ms 后掠过一道高光
  // 300   语音「你好,我是 Mini Code。」(1.9s)
  // 520   品牌字字距展开 + 底下一根线擦出
  // 1700  小标题「欢迎来到人类联盟」+ 英文小字,1850 语音跟上
  // 2850  整块标识缩小退场,同时环形准星进场
  // 3850  过曝洗白 + 音效 → 档案底板 → 三步文字序列 → 色散故障揭幕
  send("ready", { durationMs: 9400, maxMs: 20000, steps: STEPS.length, reduced: reduced, audio: !mute });
  at(60, function () { eye.classList.add("open"); });
  at(300, function () { cue("hello"); });
  at(520, function () { word.classList.add("in"); });
  at(1700, function () { subEl.classList.add("in"); subEn.classList.add("in"); });
  at(1850, function () { cue("welcome"); });
  at(2850, function () { brandEl.classList.add("out"); mark.classList.add("in"); });
  at(3850, function () { mark.classList.add("burst"); flash.classList.add("go"); cue("flash"); });
  at(4100, function () { seq.classList.add("on"); mark.classList.add("hidden"); });
  at(4250, function () { steps.classList.add("on"); next(0); });

  setTimeout(function () { finish("timeout"); }, 20000); // 自身兜底:任何异常都不能把人关在黑屏里
})();
</script>
</body>
</html>
